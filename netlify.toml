[build]
  publish = "public"
  command = "npm install"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/estate"
  to = "/.netlify/functions/estate"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/verify-checkout"
  to = "/.netlify/functions/verify-checkout"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/crawl"
  to = "/.netlify/functions/crawl"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/documents"
  to = "/.netlify/functions/documents"
  status = 200

[[redirects]]
  from = "/probate"
  to = "/probate.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/firms"
  to = "/#firms"
  status = 301

[[redirects]]
  from = "/firms.html"
  to = "/#firms"
  status = 301
  force = true

[[redirects]]
  from = "/refunds"
  to = "/refunds.html"
  status = 200

[[redirects]]
  from = "/refund"
  to = "/refunds"
  status = 301

# Static responses only (function responses set their own headers in code).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com"
